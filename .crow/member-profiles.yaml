# Maintainer-staged archives on an existing trusted worker. This checks the
# local profile protocol and real AnonCreds binding, not onion networking.
when:
  - event: manual
skip_clone: true
steps:
  - name: verified-source-checkout
    image: bash
    commands:
      - |
        ci_source_dir="/workspaces/component-sources/cfrm"
        ci_source_archive="$ci_source_dir/$CI_COMMIT_SHA.tar"
        (cd "$ci_source_dir" && sha256sum --check "$CI_COMMIT_SHA.tar.sha256")
        test "$(git get-tar-commit-id < "$ci_source_archive")" = "$CI_COMMIT_SHA"
        tar --extract --file "$ci_source_archive" --no-same-owner
        ci_cvld_commit=c416d9edd6f7f7259d84b88838b8e607b2166671
        ci_cvld_dir="/workspaces/component-sources/cvld"
        (cd "$ci_cvld_dir" && sha256sum --check "$ci_cvld_commit.tar.sha256")
        test "$(git get-tar-commit-id < "$ci_cvld_dir/$ci_cvld_commit.tar")" = "$ci_cvld_commit"
        mkdir -p .dependencies/cvld
        tar --extract --file "$ci_cvld_dir/$ci_cvld_commit.tar" --directory .dependencies/cvld --no-same-owner
  - name: anonymous-reader-contract
    image: bash
    depends_on: [verified-source-checkout]
    commands:
      - npm ci --prefix .dependencies/cvld --ignore-scripts --no-audit --no-fund
      - npm run prepare:native --prefix .dependencies/cvld
      - CVLD_ROOT="$PWD/.dependencies/cvld" timeout 600 npm test --prefix experiments/member-profiles

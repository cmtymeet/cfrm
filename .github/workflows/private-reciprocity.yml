name: Private acknowledgement experiment
on:
  push:
    branches: [main]
    paths:
      - experiments/private-reciprocity/**
      - .github/workflows/private-reciprocity.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/private-reciprocity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve initial pinned dependency lock
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          cat package-lock.json
      - run: npm run artifacts
      - run: npm test

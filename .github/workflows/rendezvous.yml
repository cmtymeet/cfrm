name: Real admission rendezvous
# Routine checks run through Crow using .ci/ccid.toml (rendezvous).
# Keep the complete hosted job as an explicit fallback.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: corbet-labs/cvld
          ref: 0f1ee4df3cc72294ba624de85542cc112c1bbbd7
          path: .ci/cvld
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify real cvld certificates and chat-key possession
        env:
          CVLD_ADMISSION_MODULE: ../.ci/cvld/src/admission.js
        run: node --test test/rendezvous.test.js

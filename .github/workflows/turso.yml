name: Turso durable storage contract
on:
  workflow_dispatch:
    inputs:
      resolve_dependencies:
        description: Add the new optional SDK graph to the retained lock
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RESOLVE_DEPENDENCIES: ${{ inputs.resolve_dependencies && '1' || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare isolated stable toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          printf 'OPENSSL_INCLUDE_DIR=%s\n' "$(pkg-config --variable=includedir openssl)" >> "$GITHUB_ENV"
          printf 'OPENSSL_LIB_DIR=%s\n' "$(pkg-config --variable=libdir openssl)" >> "$GITHUB_ENV"
      - name: Check local and official remote SQL behavior
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/turso-contract
        run: bash .ci/turso-checks.sh
      - name: Retain public validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: turso-contract-${{ github.sha }}
          path: ${{ runner.temp }}/turso-contract
          if-no-files-found: error
          retention-days: 7

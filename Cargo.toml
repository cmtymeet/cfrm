[package]
name = "cfrm"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Portable authenticated meeting board and operator introduction allocations"
repository = "https://github.com/corbet-labs/cfrm"
license-file = "LICENSE.md"
publish = false

[features]
default = []
sqlite = ["dep:rusqlite"]
permits = ["dep:blind-rsa-signatures", "dep:getrandom", "dep:zeroize"]
permit-issuer = ["permits", "sqlite", "dep:openssl"]

[dependencies]
data-encoding = "2.9"
ed25519-dalek = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
blind-rsa-signatures = { version = "0.17.2", default-features = false, optional = true }
getrandom = { version = "0.4", optional = true }
zeroize = { version = "1.8", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openssl = { version = "0.10", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[dev-dependencies]
tempfile = "3"

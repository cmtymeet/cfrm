when:
  - event: manual
skip_clone: true
variables:
  SOURCE_ARCHIVE: {default: ""}
  SOURCE_SHA256: {default: ""}
  ARTIFACT_ROOT: {default: ""}
  CARGO_TARGET_DIR: {default: ""}
  BROWSER_BIN: {default: ""}
  RESOLVE_DEPENDENCIES: {default: "0"}
  RESOLVE_SETUP: {default: "0"}
  CHECK_PHASE: {default: "full"}
  CIRCUIT_PATH: {default: ""}
  CIRCUIT_SHA256: {default: ""}
  HASH_SCHEME: {default: "sha256-v1"}
  ACCOUNTING_MODE: {default: "settlement-v1"}
  ACCOUNT_POLICY_JSON: {default: ""}
  CMSG_SOURCE_ARCHIVE: {default: ""}
  CMSG_SOURCE_SHA256: {default: ""}
  CMSG_CARGO_TARGET_DIR: {default: ""}
steps:
  - name: verified-source
    image: bash
    commands:
      - |
        set -eu
        test -n "$SOURCE_ARCHIVE"
        test -n "$SOURCE_SHA256"
        printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ARCHIVE" | sha256sum --check --strict
        test "$(git get-tar-commit-id < "$SOURCE_ARCHIVE")" = "$CI_COMMIT_SHA"
        tar --extract --touch --file "$SOURCE_ARCHIVE" --no-same-owner
  - name: browser-proof-experiment
    image: bash
    depends_on: [verified-source]
    environment:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
    commands:
      - |
        set -eu
        test -n "$ARTIFACT_ROOT"
        test -n "$CARGO_TARGET_DIR"
        mkdir -p "$CARGO_TARGET_DIR"
        flock "$CARGO_TARGET_DIR.ci.lock" bash .ci/private-accounting-checks.sh

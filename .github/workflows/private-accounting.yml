name: Private accounting browser experiment
on:
  workflow_dispatch:
    inputs:
      hash_scheme:
        description: Experimental commitment scheme to measure
        type: choice
        default: sha256-v1
        options:
          - sha256-v1
          - poseidon2-bn254-fixed-128-v1
      accounting_mode:
        description: Versioned proof relation
        type: choice
        default: settlement-v1
        options:
          - settlement-v1
          - account-state-v2
      account_policy_json:
        description: Explicit fourteen-field AccountPolicy JSON, required for account-state-v2
        type: string
        default: ''
      account_scenarios:
        description: Account-state scenarios to validate
        type: choice
        default: 'answer close'
        options:
          - 'answer close'
          - answer
          - close
permissions:
  contents: read
jobs:
  experiment:
    # Hosted Actions is primary; the matching Crow workflow is its fallback.
    runs-on: ubuntu-24.04
    # Two bounded proof scenarios plus cold builds and shipped-verifier checks.
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      CI_COMMIT_SHA: ${{ github.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CMSG_CARGO_TARGET_DIR: ${{ github.workspace }}/target-cmsg
      RESOLVE_DEPENDENCIES: '0'
      HASH_SCHEME: ${{ inputs.hash_scheme }}
      ACCOUNTING_MODE: ${{ inputs.accounting_mode }}
      ACCOUNT_POLICY_JSON: ${{ inputs.account_policy_json }}
      ACCOUNT_SCENARIOS: ${{ inputs.account_scenarios }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare runner tools
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup default stable
          printf 'BROWSER_BIN=%s\n' "$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Stage pinned cmsg source
        if: inputs.accounting_mode == 'account-state-v2'
        shell: bash
        run: |
          set -euo pipefail
          revision="$(sed -n 's/^revision = "\([0-9a-f]\{40\}\)"$/\1/p' .ci/archives.toml)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git init "$RUNNER_TEMP/cmsg-source"
          git -C "$RUNNER_TEMP/cmsg-source" fetch --depth 1 https://github.com/cmtymeet/cmsg.git "$revision"
          test "$(git -C "$RUNNER_TEMP/cmsg-source" rev-parse FETCH_HEAD)" = "$revision"
          git -C "$RUNNER_TEMP/cmsg-source" archive "$revision" > "$RUNNER_TEMP/cmsg-source.tar"
          printf 'CMSG_SOURCE_ARCHIVE=%s\n' "$RUNNER_TEMP/cmsg-source.tar" >> "$GITHUB_ENV"
          printf 'CMSG_SOURCE_SHA256=%s\n' "$(sha256sum "$RUNNER_TEMP/cmsg-source.tar" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Run the shared experiment
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/accounting-evidence
        run: bash .ci/private-accounting-checks.sh
      - name: Retain exact setup and proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-accounting-experiment
          path: ${{ runner.temp }}/accounting-evidence
          if-no-files-found: warn
          retention-days: 7

name: Anonymous permit experiments
on:
  push:
    branches: [main]
    paths:
      - experiments/anonymous-permits/**
      - .github/workflows/anonymous-permits.yml
  pull_request:
    paths:
      - experiments/anonymous-permits/**
      - .github/workflows/anonymous-permits.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: experiments/anonymous-permits
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

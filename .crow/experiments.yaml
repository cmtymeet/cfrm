# Optional manual execution on an existing trusted Crow worker. No service,
# credential, host configuration or paid infrastructure is provisioned here.
when:
  - event: manual
skip_clone: true
steps:
  - name: verified-source-checkout
    image: bash
    commands:
      - |
        ci_source_dir="/workspaces/component-sources/cfrm"
        ci_source_archive="$ci_source_dir/$CI_COMMIT_SHA.tar"
        (cd "$ci_source_dir" && sha256sum --check "$CI_COMMIT_SHA.tar.sha256")
        test "$(git get-tar-commit-id < "$ci_source_archive")" = "$CI_COMMIT_SHA"
        tar --extract --file "$ci_source_archive" --no-same-owner
  - name: numerical-and-rendezvous-tests
    image: bash
    depends_on: [verified-source-checkout]
    commands:
      - node --version
      - npm test
  - name: anonymous-permit-tests
    image: bash
    depends_on: [numerical-and-rendezvous-tests]
    commands:
      - npm ci --prefix experiments/anonymous-permits --ignore-scripts --no-audit --no-fund
      - npm test --prefix experiments/anonymous-permits
  - name: private-acknowledgement-tests
    image: bash
    depends_on: [anonymous-permit-tests]
    commands:
      - npm ci --prefix experiments/private-reciprocity --ignore-scripts --no-audit --no-fund
      - npm run artifacts --prefix experiments/private-reciprocity
      - |
        ci_test_status=0
        npm test --prefix experiments/private-reciprocity || ci_test_status=1
        node --test --test-concurrency=1 experiments/private-reciprocity/enrollment.test.js || ci_test_status=1
        exit "$ci_test_status"

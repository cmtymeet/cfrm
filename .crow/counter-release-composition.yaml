# Actual member keys and cryptographic services, driven only by synthetic data.
# The Node/native harness spans test roles and is not an operator deployment.
when:
  - event: manual
skip_clone: true
steps:
  - name: verified-component-sources
    image: bash
    commands:
      - |
        ci_source_dir="/workspaces/component-sources/cfrm"
        ci_source_archive="$ci_source_dir/$CI_COMMIT_SHA.tar"
        (cd "$ci_source_dir" && sha256sum --check "$CI_COMMIT_SHA.tar.sha256")
        test "$(git get-tar-commit-id < "$ci_source_archive")" = "$CI_COMMIT_SHA"
        tar --extract --touch --file "$ci_source_archive" --no-same-owner
        for ci_component in cvld cmsg; do
          case "$ci_component" in
            cvld) ci_component_commit=c416d9edd6f7f7259d84b88838b8e607b2166671 ;;
            cmsg) ci_component_commit=7c6740369cf17779c2b749547adfbca92b899f34 ;;
          esac
          ci_component_dir="/workspaces/component-sources/$ci_component"
          ci_component_archive="$ci_component_dir/$ci_component_commit.tar"
          (cd "$ci_component_dir" && sha256sum --check "$ci_component_commit.tar.sha256")
          test "$(git get-tar-commit-id < "$ci_component_archive")" = "$ci_component_commit"
          mkdir -p ".dependencies/$ci_component"
          tar --extract --touch --file "$ci_component_archive" --directory ".dependencies/$ci_component" --no-same-owner
        done
  - name: counter-release-cryptographic-composition
    image: bash
    depends_on: [verified-component-sources]
    environment:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: /caches/cargo/component-targets/cmsg
    commands:
      - npm ci --prefix experiments/private-reciprocity --ignore-scripts --no-audit --no-fund
      - npm run artifacts --prefix experiments/private-reciprocity
      - npm ci --prefix experiments/directional-receipts --ignore-scripts --no-audit --no-fund
      - |
        mkdir -p "$CARGO_TARGET_DIR"
        flock "$CARGO_TARGET_DIR.ci.lock" bash -euc '
          export CVLD_ADMISSION_MODULE="$PWD/.dependencies/cvld/src/admission.js"
          export CMSG_RELEASE_HARNESS="$CARGO_TARGET_DIR/debug/counter_bridge"
          ci_native_manifest=.dependencies/cmsg/experiments/first-contact-release/Cargo.toml
          timeout 1800 cargo build --locked --manifest-path "$ci_native_manifest" --bin counter_bridge
          ci_test_status=0
          cargo fmt --manifest-path "$ci_native_manifest" --package cmsg-first-contact-release-experiment -- --check || ci_test_status=1
          timeout 1200 npm test --prefix experiments/directional-receipts || ci_test_status=1
          timeout 120 npm run test:bridge --prefix experiments/directional-receipts || ci_test_status=1
          timeout 1200 npm run test:composition --prefix experiments/directional-receipts || ci_test_status=1
          exit "$ci_test_status"
        '
  - name: capture-formatted-counter-bridge
    image: bash
    depends_on: [counter-release-cryptographic-composition]
    when:
      - status: [success, failure]
    commands:
      - |
        # Formatting is after execution. Apply, commit and rerun any changes
        # before claiming the formatted source is validated.
        cargo fmt --manifest-path .dependencies/cmsg/experiments/first-contact-release/Cargo.toml --package cmsg-first-contact-release-experiment
        ci_artifact_dir="/workspaces/component-releases/cfrm/$CI_COMMIT_SHA"
        mkdir -p "$ci_artifact_dir"
        tar --create --file "$ci_artifact_dir/counter-bridge-formatted.tar" --directory .dependencies/cmsg/experiments/first-contact-release src/bin/counter_bridge.rs
        (cd "$ci_artifact_dir" && sha256sum counter-bridge-formatted.tar > counter-bridge-formatted.tar.sha256)
        cat "$ci_artifact_dir/counter-bridge-formatted.tar.sha256"

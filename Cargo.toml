[package]
name = "cfrm"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Portable authenticated meeting board and operator introduction allocations"
repository = "https://github.com/corbet-labs/cfrm"
license-file = "LICENSE.md"
publish = false

[features]
default = []
sqlite = ["dep:rusqlite"]

[dependencies]
data-encoding = "2.9"
ed25519-dalek = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = "3"
